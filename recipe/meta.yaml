{% set name = "statmorph" %}
{% set version = "0.7.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d736b8106c7f08be7c1030031f01ac5a29c5201106c33c736ef218ff2c9ed0ec

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv
  skip: true  # [py<312]

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - numpy >=2.0
    - scipy >=1.15
    - scikit-image >=0.25.2
    - astropy >=7.0
    - photutils >=3.1.1

test:
  imports:
    - statmorph
    - statmorph.tests
  requires:
    - pytest

about:
  home: https://statmorph.readthedocs.io/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Non-parametric morphological diagnostics of galaxy images
  description: |
    Python code for calculating non-parametric morphological diagnostics
    of galaxy images.
  doc_url: https://statmorph.readthedocs.io/
  dev_url: https://github.com/vrodgom/statmorph

extra:
  recipe-maintainers:
    - vrodgom
